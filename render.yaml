# Render Blueprint: creates the web service AND a PostgreSQL database, wired together.
# Dashboard -> New -> Blueprint -> select this repository.
databases:
  - name: eod-db
    databaseName: eod
    user: eod
    plan: free          # free databases are time-limited on Render; use a paid plan for permanent storage

services:
  - type: web
    name: eod-report
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: eod-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true      # random value generated by Render, never stored in git
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_PASSWORD
        sync: false              # you type this in the Render dashboard (min 8 chars); not stored in git
